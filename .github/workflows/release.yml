name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    uses: ./.github/workflows/build-macos.yml
    with:
      sign: true
    secrets: inherit

  build-windows:
    uses: ./.github/workflows/build-windows.yml
    with:
      sign: true
    secrets: inherit

  publish:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read and validate release version
        id: metadata
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME}"
          test "$tag" = "v$version" || {
            echo "Tag $tag does not match package version $version" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: DeepSeek-Harness-${{ steps.metadata.outputs.version }}-*
          path: downloaded
          merge-multiple: false

      - name: Assemble signed release assets
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          mkdir -p release-assets
          find downloaded -type f \( \
            -name '*.dmg' -o \
            -name '*.app.tar.gz' -o \
            -name '*.exe' -o \
            -name '*.msi' -o \
            -name '*.sig' \
          \) -exec cp {} release-assets/ \;

          expected=(
            "DeepSeek.Harness_${VERSION}_macos_arm64.dmg"
            "DeepSeek.Harness_${VERSION}_macos_arm64.app.tar.gz"
            "DeepSeek.Harness_${VERSION}_macos_x86_64.dmg"
            "DeepSeek.Harness_${VERSION}_macos_x86_64.app.tar.gz"
            "DeepSeek.Harness_${VERSION}_windows_x86_64-setup.exe"
            "DeepSeek.Harness_${VERSION}_windows_x86_64.msi"
          )
          for file in "${expected[@]}"; do
            test -s "release-assets/$file" || { echo "Missing release asset: $file" >&2; exit 1; }
          done

          for file in \
            "${expected[1]}" \
            "${expected[3]}" \
            "${expected[4]}" \
            "${expected[5]}"; do
            test -s "release-assets/$file.sig" || { echo "Missing updater signature: $file.sig" >&2; exit 1; }
          done

      - name: Generate updater manifest and checksums
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          notes='修复桌面端启动参数兼容性：不再自动打开系统浏览器，并修正 Insights 插件参数导致 dsh 无法启动的问题。'
          node scripts/create-updater-manifest.mjs \
            --version "$VERSION" \
            --tag "$TAG" \
            --root release-assets \
            --output release-assets/latest.json \
            --notes "$notes"

          (
            cd release-assets
            for file in *.dmg *.app.tar.gz *.exe *.msi; do
              test -f "$file" || continue
              sha256sum "$file"
            done | sort -k2 > SHA256SUMS.txt
          )

          if [ "$VERSION" = "0.2.0" ]; then
            release_notes=$'自动更新已启用：App 启动后检查新版本，确认后下载、安装并重启。\n\nmacOS 12.7.6+ Apple Silicon 与 Intel 使用对应架构的 updater 包；Windows x64 同时提供 NSIS 与 MSI updater 包。Release 资产包含签名文件、latest.json 和 SHA256 校验清单。\n\n首次使用自动更新需要从 v0.1.9 手动升级到本版本。'
          elif [ "$VERSION" = "0.2.2" ]; then
            release_notes=$'## 用量插件兼容性修复\n\n- Harness Insights 升级至 `0.1.3`。\n- 适配 `@deepseek-ai/dsh@0.1.1-rc.2` 的新版 Session Projection API。\n- 修复用量数据无法正确输出到客户端的问题。\n- 验证实时 Token/工具统计与历史会话冷恢复结果一致。\n- 同步更新插件依赖声明和中英文兼容性文档。\n\n## 运行时与平台\n\n- 继续内置 `@deepseek-ai/dsh@0.1.1-rc.2`。\n- 支持 macOS 12.7.6+ Apple Silicon、macOS Intel 和 Windows x64。\n- Release 资产包含 updater 签名、`latest.json` 和 SHA256 校验清单。'
          elif [ "$VERSION" = "0.2.3" ]; then
            release_notes=$'## 桌面启动修复\n\n- 修复每次启动桌面端时系统浏览器被自动打开的问题。\n- 修复 Insights 插件的 `--patch` 参数被错误传给 Web 服务，导致 `unknown option --patch`、dsh 退出且桌面端无法连接的问题。\n- 桌面工作台现在只在 Tauri 桌面 WebView 中加载。\n- 保留对话中外部链接使用系统默认浏览器打开的行为。\n- 增加启动参数顺序回归测试。\n\n## 运行时与平台\n\n- 继续内置 `@deepseek-ai/dsh@0.1.1-rc.2`。\n- 支持 macOS 12.7.6+ Apple Silicon、macOS Intel 和 Windows x64。\n- Release 资产包含 updater 签名、`latest.json` 和 SHA256 校验清单。'
          else
            release_notes=$'Release 资产包含签名文件、latest.json 和 SHA256 校验清单。'
          fi
          printf '%s\n' "$release_notes" > release-notes.md

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          notes=$(<release-notes.md)
          gh release create "$TAG" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "DeepSeek Harness Desktop v$VERSION" \
            --notes "$notes" \
            --generate-notes \
            --latest
