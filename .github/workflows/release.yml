name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    uses: ./.github/workflows/build-macos.yml
    with:
      sign: true
    secrets: inherit

  build-windows:
    uses: ./.github/workflows/build-windows.yml
    with:
      sign: true
    secrets: inherit

  publish:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read and validate release version
        id: metadata
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME}"
          test "$tag" = "v$version" || {
            echo "Tag $tag does not match package version $version" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: DeepSeek-Harness-${{ steps.metadata.outputs.version }}-*
          path: downloaded
          merge-multiple: false

      - name: Assemble signed release assets
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          mkdir -p release-assets
          find downloaded -type f \( \
            -name '*.dmg' -o \
            -name '*.app.tar.gz' -o \
            -name '*.exe' -o \
            -name '*.msi' -o \
            -name '*.sig' \
          \) -exec cp {} release-assets/ \;

          expected=(
            "DeepSeek.Harness_${VERSION}_macos_arm64.dmg"
            "DeepSeek.Harness_${VERSION}_macos_arm64.app.tar.gz"
            "DeepSeek.Harness_${VERSION}_macos_x86_64.dmg"
            "DeepSeek.Harness_${VERSION}_macos_x86_64.app.tar.gz"
            "DeepSeek.Harness_${VERSION}_windows_x86_64-setup.exe"
            "DeepSeek.Harness_${VERSION}_windows_x86_64.msi"
          )
          for file in "${expected[@]}"; do
            test -s "release-assets/$file" || { echo "Missing release asset: $file" >&2; exit 1; }
          done

          for file in \
            "${expected[1]}" \
            "${expected[3]}" \
            "${expected[4]}" \
            "${expected[5]}"; do
            test -s "release-assets/$file.sig" || { echo "Missing updater signature: $file.sig" >&2; exit 1; }
          done

      - name: Generate updater manifest and checksums
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          if [ "$VERSION" = "0.3.3" ]; then
            notes='内置最新版社区插件矩阵，更新渠道配置中心和 iMessage 纯文本回复格式，并完成 macOS / Windows 平台兼容性验证。'
          elif [ "$VERSION" = "0.3.4" ]; then
            notes='升级核心运行时至 @deepseek-ai/dsh@0.1.5-alpha.1，修复历史会话用量洞察不显示，并同步完成 macOS 兼容性验证。'
          fi
          node scripts/create-updater-manifest.mjs \
            --version "$VERSION" \
            --tag "$TAG" \
            --root release-assets \
            --output release-assets/latest.json \
            --notes "$notes"

          (
            cd release-assets
            for file in *.dmg *.app.tar.gz *.exe *.msi; do
              test -f "$file" || continue
              sha256sum "$file"
            done | sort -k2 > SHA256SUMS.txt
          )

          if [ "$VERSION" = "0.2.0" ]; then
            release_notes=$'自动更新已启用：App 启动后检查新版本，确认后下载、安装并重启。\n\nmacOS 12.7.6+ Apple Silicon 与 Intel 使用对应架构的 updater 包；Windows x64 同时提供 NSIS 与 MSI updater 包。Release 资产包含签名文件、latest.json 和 SHA256 校验清单。\n\n首次使用自动更新需要从 v0.1.9 手动升级到本版本。'
          elif [ "$VERSION" = "0.2.2" ]; then
            release_notes=$'## 用量插件兼容性修复\n\n- Harness Insights 升级至 `0.1.3`。\n- 适配 `@deepseek-ai/dsh@0.1.1-rc.2` 的新版 Session Projection API。\n- 修复用量数据无法正确输出到客户端的问题。\n- 验证实时 Token/工具统计与历史会话冷恢复结果一致。\n- 同步更新插件依赖声明和中英文兼容性文档。\n\n## 运行时与平台\n\n- 继续内置 `@deepseek-ai/dsh@0.1.1-rc.2`。\n- 支持 macOS 12.7.6+ Apple Silicon、macOS Intel 和 Windows x64。\n- Release 资产包含 updater 签名、`latest.json` 和 SHA256 校验清单。'
          elif [ "$VERSION" = "0.2.3" ]; then
            release_notes=$'## 桌面启动修复\n\n- 修复每次启动桌面端时系统浏览器被自动打开的问题。\n- 修复 Insights 插件的 `--patch` 参数被错误传给 Web 服务，导致 `unknown option --patch`、dsh 退出且桌面端无法连接的问题。\n- 桌面工作台现在只在 Tauri 桌面 WebView 中加载。\n- 保留对话中外部链接使用系统默认浏览器打开的行为。\n- 增加启动参数顺序回归测试。\n\n## 运行时与平台\n\n- 继续内置 `@deepseek-ai/dsh@0.1.1-rc.2`。\n- 支持 macOS 12.7.6+ Apple Silicon、macOS Intel 和 Windows x64。\n- Release 资产包含 updater 签名、`latest.json` 和 SHA256 校验清单。'
          elif [ "$VERSION" = "0.2.4" ]; then
            release_notes=$'## 消息通道集成\n\n- 内置可视化消息通道配置插件。\n- 内置飞书 / Lark 通道，安装后可直接在设置中配置。\n- macOS 内置 iMessage 通道，并保留本地授权提示。\n- Windows 构建不携带 iMessage，也不会在配置界面显示 iMessage。\n\n## 运行时与平台\n\n- 继续内置 `@deepseek-ai/dsh@0.1.1-rc.2`。\n- 保留 Harness Insights 用量洞察。\n- Release 资产包含签名文件、latest.json 和 SHA256 校验清单。'
          elif [ "$VERSION" = "0.2.5" ]; then
            release_notes=$'## 启动兼容性修复\n\n- 修复桌面端内置插件与用户已经安装到 Web profile 的同名插件重复加载的问题。\n- 现在会自动识别 profile 中已配置的插件，避免出现 `duplicate loader entry id` 启动错误。\n- 保留用户已有插件配置，不会删除或覆盖 profile 设置。\n\n## 运行时与平台\n\n- 继续内置 `@deepseek-ai/dsh@0.1.1-rc.2`。\n- macOS 提供可视化配置、飞书 / Lark、iMessage、Core 和 Harness Insights。\n- Windows 构建不携带 iMessage，也不会在配置界面显示 iMessage。\n- Release 资产包含签名文件、latest.json 和 SHA256 校验清单。'
          elif [ "$VERSION" = "0.2.6" ]; then
            release_notes=$'## iMessage 本机模式与设置图标\n\n- iMessage 仅保留本机 `Messages.app + chat.db` 接入。\n- 移除 `imsg` CLI、Photon 云端和 Claw/Sendblue 云中继，消息不经过第三方服务。\n- 配置页面不再展示模式选择、`imsg` 或远程中继字段。\n- 将“消息通道”设置项的侧栏图标替换为 DSH 原生 `IconNewChatOutline16` 消息图标。\n- 需要为 DeepSeek Harness 授予完全磁盘访问和自动化控制“信息”的权限。\n\n## 运行时与平台\n\n- 继续内置 `@deepseek-ai/dsh@0.1.1-rc.2`。\n- Release 资产包含签名文件、latest.json 和 SHA256 校验清单。'
          elif [ "$VERSION" = "0.2.7" ]; then
            release_notes=$'## macOS 深色模式图标\n\n- 安装包内置 appearance-aware App Icon（`Assets.car`）。\n- 系统浅色显示黑鲸浅底，深色或 Dark 图标样式显示白鲸深底。\n- 旧版 macOS 继续回退到 `.icns`。\n\n## 内置插件\n\n- 构建时从 npm 安装最新已发布版本：Insights `0.1.4`、消息通道配置 `0.1.4`、企业微信 `0.1.1`、飞书 `0.1.0`、iMessage `0.1.1`、Core `0.1.0`。\n- 预置企业微信智能机器人长连接通道。\n\n## 运行时与平台\n\n- 继续内置 `@deepseek-ai/dsh@0.1.1-rc.2`。\n- Release 资产包含签名文件、latest.json 和 SHA256 校验清单。'
          elif [ "$VERSION" = "0.2.8" ]; then
            release_notes=$'## 内置多语言包\n\n- 预置 `@anarkhgatsby/deepseek-harness-locale-pack@0.1.1`。\n- 在官方简体中文 / English 之外，设置中可切换繁體中文、日本語、한국어、Français、Deutsch、Русский、Español，以及藏文、蒙古文、维吾尔文、彝文。\n\n## 运行时与平台\n\n- 继续内置 `@deepseek-ai/dsh@0.1.1-rc.2`。\n- Release 资产包含签名文件、latest.json 和 SHA256 校验清单。'
          elif [ "$VERSION" = "0.3.0" ]; then
            release_notes=$'## 渠道插件与核心库升级\n\n- 升级通道核心库 `@anarkhgatsby/deepseek-harness-core` 至 `^0.1.2`，适配会话事件机制。\n- 同步发布并内置最新版企业微信通道（`0.1.3`）与 iMessage 通道（`0.1.3`）。\n- 增加 `DSH_CHANNEL_DEBUG` 环境变量控制通道调试日志输出。\n- 优化 pnpm workspace 依赖对齐与构建流程。\n\n## 运行时与平台\n\n- 继续内置 `@deepseek-ai/dsh@0.1.1-rc.2`。\n- Release 资产包含签名文件、latest.json 和 SHA256 校验清单。'
          elif [ "$VERSION" = "0.3.1" ]; then
            release_notes=$'## macOS 12 Monterey 启动白屏兼容性修复\n\n- 修复因 macOS 12 (Monterey) 系统底层 WebKit 613（Safari < 16.4）不支持 ES2022 Class Static Blocks（`static { ... }` 类静态初始化块）语法导致的桌面端启动白屏（`SyntaxError`）问题。\n- 自动将类静态块语法降级为标准原型链赋值，并注入 `Promise.withResolvers` 原生 Polyfill 兼容垫片。\n- 修复服务端 `READY_MARKUP` 引导脚本调用安全降级，防止低版本内核解析中断。\n- 构建管道与运行时环境自动化检验兼容性，确保 macOS 12.7.6+、最新版 macOS 与 Windows 均可稳定正常渲染。\n\n## 运行时与平台\n\n- 继续内置 `@deepseek-ai/dsh@0.1.1-rc.2`。\n- Release 资产包含签名文件、latest.json 和 SHA256 校验清单。'
          elif [ "$VERSION" = "0.3.3" ]; then
            release_notes=$'## 插件集成与消息体验更新\n\n- 内置并验证最新版社区插件矩阵：\n  - 可视化渠道配置 `@anarkhgatsby/deepseek-harness-channel-config@0.1.7`\n  - Gateway Core `@anarkhgatsby/deepseek-harness-core@0.1.4`\n  - 飞书 / Lark `@anarkhgatsby/deepseek-harness-channel-feishu@0.1.2`\n  - 钉钉 `@anarkhgatsby/deepseek-harness-channel-dingtalk@0.1.0`\n  - 企业微信 / WeCom `@anarkhgatsby/deepseek-harness-channel-wecom@0.1.4`\n  - macOS iMessage `@anarkhgatsby/deepseek-harness-channel-imessage@0.1.5`\n  - Harness Insights `@anarkhgatsby/deepseek-harness-insights@0.1.6`\n  - Locale Pack `@anarkhgatsby/deepseek-harness-locale-pack@0.1.4`\n- Config 渠道列表改为运行时驱动，新增已安装渠道可以正常显示。\n- 钉钉配置卡片使用官方亮色 / 深色图标资源，并统一视觉尺寸；AppKey 示例改为安全占位符。\n- iMessage 回复在通过 Messages.app 发送前转换为易读纯文本：移除 Markdown 加粗、斜体、代码和删除线标记，优化标题、列表、链接与代码块排版。\n- Windows 构建继续排除 iMessage，避免在不支持 Messages.app 的平台展示不可用入口。\n- 所有内置插件已在本机完成收发、配置和启动验证。\n\n## 运行时与平台\n\n- macOS 支持 Apple Silicon 与 Intel，最低系统版本为 macOS 12.7.6。\n- Windows 提供 x64 安装包，构建不携带 iMessage。\n- Release 资产包含签名文件、latest.json 和 SHA256 校验清单。'
          elif [ "$VERSION" = "0.3.4" ]; then
            release_notes=$'## 用量洞察修复\n\n- 内置核心运行时升级至官方 `@deepseek-ai/dsh@0.1.5-alpha.1`。\n- 修复新版历史投影缓存接口不匹配导致的历史会话用量数据不显示问题。\n- 保留本地 Token、模型、工具和会话统计，不读取消息正文，也不上传数据。\n\n## 运行时与平台\n\n- 继续提供 macOS Apple Silicon、macOS Intel 和 Windows x64 安装包。\n- 保留 macOS 12.7.6+ WebKit 兼容处理、自动更新清单和 SHA256 校验。\n- Release 资产包含 updater 签名、latest.json 和 SHA256 校验清单。'
          else
            release_notes=$'Release 资产包含签名文件、latest.json 和 SHA256 校验清单。'
          fi
          printf '%s\n' "$release_notes" > release-notes.md

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          notes=$(<release-notes.md)
          gh release create "$TAG" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "DeepSeek Harness Desktop v$VERSION" \
            --notes "$notes" \
            --generate-notes \
            --latest
