name: Build macOS

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      sign:
        description: Sign updater archives for a GitHub Release
        required: false
        default: false
        type: boolean
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-macos.yml"
      - "scripts/**"
      - "packages/**"
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - ".github/workflows/build-macos.yml"
      - "scripts/**"
      - "packages/harness-insights/**"
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MACOSX_DEPLOYMENT_TARGET: "12.7.6"
  NODE_OPTIONS: "--max-old-space-size=4096"
  npm_config_before: "2026-08-21T13:00:00Z"

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
            runtime_command: pnpm prepare:runtime
            tauri_args: --config src-tauri/tauri.updater.conf.json --no-sign --bundles app
            verify_command: pnpm verify:macos:arm
            app_path: src-tauri/target/release/bundle/macos/DeepSeek Harness.app
          - arch: x86_64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            runtime_command: pnpm prepare:runtime:intel
            tauri_args: --config src-tauri/tauri.updater.conf.json --target x86_64-apple-darwin --no-sign --bundles app
            verify_command: pnpm verify:macos:intel
            app_path: src-tauri/target/x86_64-apple-darwin/release/bundle/macos/DeepSeek Harness.app

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Read package version
        id: metadata
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-${{ matrix.arch }}

      - name: Prepare self-contained macOS runtime
        run: ${{ matrix.runtime_command }}

      - name: Verify Harness Insights
        run: pnpm test:insights

      - name: Build unsigned macOS app
        run: |
          pnpm prepare:licenses
          pnpm tauri build ${{ matrix.tauri_args }}
          ${{ matrix.verify_command }}

      - name: Verify Markdown compatibility behavior
        run: pnpm test:runtime:compat

      - name: Verify bundled pnpm
        run: pnpm test:bundled-pnpm

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run Rust Clippy
        run: >-
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --
          -D warnings -A clippy::items-after-test-module

      - name: Prepare updater archive
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          mkdir -p artifacts
          source_archive="${{ matrix.app_path }}.tar.gz"
          updater_archive="artifacts/DeepSeek.Harness_${VERSION}_macos_${{ matrix.arch }}.app.tar.gz"
          test -f "$source_archive"
          cp "$source_archive" "$updater_archive"

      - name: Sign updater archive
        if: ${{ inputs.sign }}
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          updater_archive="artifacts/DeepSeek.Harness_${VERSION}_macos_${{ matrix.arch }}.app.tar.gz"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          pnpm tauri signer sign "$updater_archive"
          test -s "$updater_archive.sig"

      - name: Create and verify compact DMG
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          dmg="artifacts/DeepSeek.Harness_${VERSION}_macos_${{ matrix.arch }}.dmg"
          updater_archive="artifacts/DeepSeek.Harness_${VERSION}_macos_${{ matrix.arch }}.app.tar.gz"
          node scripts/create-macos-dmg.mjs "${{ matrix.app_path }}" "$dmg"
          hdiutil verify "$dmg"
          (cd artifacts && shasum -a 256 "$(basename "$dmg")" "$(basename "$updater_archive")") > artifacts/SHA256SUMS.txt
          cat artifacts/SHA256SUMS.txt

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-${{ steps.metadata.outputs.version }}-macos-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
