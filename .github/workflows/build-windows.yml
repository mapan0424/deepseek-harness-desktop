name: Build Windows x64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-windows.yml"
      - "scripts/prepare-runtime-windows.mjs"
      - "scripts/patch-runtime-compat.mjs"
      - "scripts/test-runtime-compat.mjs"
      - "scripts/verify-windows-bundle.mjs"
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: windows-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 installers
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-x64

      - name: Prepare self-contained Windows runtime
        run: pnpm prepare:runtime:windows

      - name: Verify Markdown compatibility behavior
        run: pnpm test:runtime:compat

      - name: Verify Harness Insights
        run: pnpm test:insights

      - name: Generate Rust license report
        run: pnpm prepare:licenses

      - name: Build NSIS and MSI installers
        run: pnpm tauri build --config src-tauri/tauri.windows.conf.json --target x86_64-pc-windows-msvc --no-sign

      - name: Verify expanded Windows bundle
        shell: pwsh
        run: node scripts/verify-windows-bundle.mjs "src-tauri/target/x86_64-pc-windows-msvc/release"

      - name: Collect installers and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $files = @()
          $files += Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis" -Filter *.exe
          $files += Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi" -Filter *.msi
          if ($files.Count -lt 2) { throw "Expected NSIS and MSI installers." }
          foreach ($file in $files) {
            $name = if ($file.Extension -eq ".exe") { "DeepSeek.Harness_0.1.5_windows_x86_64-setup.exe" } else { "DeepSeek.Harness_0.1.5_windows_x86_64.msi" }
            Copy-Item $file.FullName (Join-Path artifacts $name)
          }
          Get-ChildItem artifacts -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii artifacts/SHA256SUMS.txt
          Get-Content artifacts/SHA256SUMS.txt

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-0.1.5-Windows-x86_64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
